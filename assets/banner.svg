<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#311042;#1e1b4b" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Grid / Network Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="150" cy="100" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="150;200;150" dur="6s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;140;100" dur="6s" repeatCount="indefinite" />
  </circle>

  <circle cx="1050" cy="220" r="140" fill="#ec4899" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="1050;1000;1050" dur="7s" repeatCount="indefinite" />
    <animate attributeName="cy" values="220;180;220" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Main Content -->
  <g text-anchor="middle" transform="translate(600, 140)">
    <!-- Badge -->
    <rect x="-140" y="-85" width="280" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="url(#accent-grad)" stroke-width="1.5" />
    <text x="0" y="-64" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="2">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome Learning Experience Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Personalized Learning • Skills Intelligence • Open-Source LMS &amp; Enterprise SaaS
    </text>
  </g>

  <!-- Decorative Animated Pulse Line -->
  <path d="M 100 270 Q 300 250 600 270 T 1100 270" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.7">
    <animate attributeName="d" values="M 100 270 Q 300 250 600 270 T 1100 270; M 100 270 Q 300 290 600 270 T 1100 270; M 100 270 Q 300 250 600 270 T 1100 270" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Particle Dots -->
  <circle cx="300" cy="260" r="4" fill="#6366f1">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="270" r="4" fill="#a855f7">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="260" r="4" fill="#ec4899">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>
